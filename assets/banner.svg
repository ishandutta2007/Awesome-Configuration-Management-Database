<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dynamic Glowing Background Network Grid -->
  <g opacity="0.25">
    <path d="M 0 40 L 1200 40 M 0 100 L 1200 100 M 0 160 L 1200 160 M 0 220 L 1200 220 M 0 280 L 1200 280" stroke="#334155" stroke-width="1" stroke-dasharray="6 6"/>
    <path d="M 150 0 L 150 320 M 350 0 L 350 320 M 550 0 L 550 320 M 750 0 L 750 320 M 950 0 L 950 320 M 1150 0 L 1150 320" stroke="#334155" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  <!-- Dynamic Pulsing Connection Lines (Background Layer) -->
  <g opacity="0.4">
    <!-- Pulse Line 1 -->
    <path d="M 100 250 Q 300 280 500 240 T 900 260 T 1100 220" fill="none" stroke="#6366f1" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="8s" repeatCount="indefinite"/>
    </path>
    <!-- Pulse Line 2 -->
    <path d="M 50 80 Q 350 40 650 90 T 1150 60" fill="none" stroke="#a855f7" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="1000,0;0,1000" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating Dynamic Tech Orbit Particles (Background Layer) -->
  <g>
    <circle cx="200" cy="80" r="4" fill="#38bdf8" opacity="0.7">
      <animate attributeName="cy" values="80;95;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="240" r="6" fill="#818cf8" opacity="0.6">
      <animate attributeName="cy" values="240;220;240" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="70" r="5" fill="#c084fc" opacity="0.5">
      <animate attributeName="cx" values="950;970;950" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="230" r="5" fill="#34d399" opacity="0.6">
      <animate attributeName="cy" values="230;215;230" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Visual Feature Chips / Pillars (Positioned low/sides to not obscure foreground text) -->
  <g transform="translate(260, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <circle cx="20" cy="18" r="6" fill="#38bdf8"/>
    <text x="36" y="23" fill="#e2e8f0" font-size="13" font-weight="600">Asset Discovery</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="200" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
    <circle cx="215" cy="18" r="6" fill="#818cf8"/>
    <text x="231" y="23" fill="#e2e8f0" font-size="13" font-weight="600">Dependency Mapping</text>

    <!-- Pill 3 -->
    <rect x="410" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" opacity="0.9"/>
    <circle cx="430" cy="18" r="6" fill="#c084fc"/>
    <text x="446" y="23" fill="#e2e8f0" font-size="13" font-weight="600">ITIL &amp; ITSM Hub</text>
  </g>

  <!-- FOREGROUND CONTENT: Header & Title & Subtitle (Always crisp & visible) -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Top Category Badge -->
    <g transform="translate(0, 42)">
      <rect x="-140" y="0" width="280" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
      <text x="0" y="18" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE ITIL ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="118" fill="url(#title-grad)" font-size="40" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Awesome CMDB Platforms
    </text>
    <!-- Crisp Overlay Title -->
    <text x="0" y="118" fill="url(#title-grad)" font-size="40" font-weight="900" letter-spacing="-0.5">
      Awesome CMDB Platforms
    </text>

    <!-- Subtitle -->
    <text x="0" y="160" fill="#94a3b8" font-size="17" font-weight="400" letter-spacing="0.2">
      Curated Directory of SaaS &amp; Open-Source Configuration Management Databases
    </text>

    <!-- Core Specs Sub-line -->
    <text x="0" y="190" fill="#64748b" font-size="13" font-weight="500">
      IT Asset Inventory • Service Mapping • Infrastructure Source of Truth • Continuous Discovery
    </text>
  </g>
</svg>
